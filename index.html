<style>
@font-face{font-family:'Patrick Hand';font-style:normal;font-weight:400;font-display:swap;src:url(https://fonts.gstatic.com/s/patrickhand/v25/LDI1apSQOAYtSuYWp8ZhfYe8XsLL.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;ascent-override:96.5%;descent-override:38.5%;line-gap-override:0%}
@font-face{font-family:'Patrick Hand';font-style:normal;font-weight:400;font-display:swap;src:url(https://fonts.gstatic.com/s/patrickhand/v25/LDI1apSQOAYtSuYWp8ZhfYe8UMLLq7s.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF;ascent-override:96.5%;descent-override:38.5%;line-gap-override:0%}
@font-face{font-family:'Patrick Hand';font-style:normal;font-weight:400;font-display:swap;src:url(https://fonts.gstatic.com/s/patrickhand/v25/LDI1apSQOAYtSuYWp8ZhfYe8UcLLq7s.woff2) format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+1EA0-1EF9,U+20AB;ascent-override:96.5%;descent-override:38.5%;line-gap-override:0%}
:root{
  --ln:40px;              /* altura da pauta: TUDO dentro da folha anda nesse ritmo */
  --desk:#CFD8E2; --paper:#FFFFFF; --rule:#BFD5EE; --margin:#F09A9A;
  --pen:#1B3FA0; --pencil:#5A6270; --ink:#22283A; --redpen:#D3352B; --okpen:#1E8A4A;
  --board:#2F5D50; --board-2:#284F44; --chalk:#F4F7F2; --wood:#9A6A3C; --wood-2:#7C5230;
  --postit:#FFE46B; --star:#F2B705;
  --mg:48px;              /* margem vermelha (depois da espiral) */
  --bar:58px; --side:290px;
  --hand:"Patrick Hand","Comic Sans MS","Chalkboard SE",sans-serif;
  --ui:"Andika",system-ui,sans-serif;
  color-scheme:light;
}
@media (min-width:700px){:root{--mg:84px}}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:var(--ui);font-size:16px;-webkit-tap-highlight-color:transparent}
/* a carteira (laminado) */
body{background:var(--desk) radial-gradient(rgba(255,255,255,.35) 1px,transparent 1.5px) 0 0/6px 6px;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

/* ================= A FOLHA DO CADERNO ================= */
.page{position:relative;background-color:var(--paper);
  background-image:
    linear-gradient(90deg,transparent calc(var(--mg) - 1px),var(--margin) calc(var(--mg) - 1px) calc(var(--mg) + 1px),transparent calc(var(--mg) + 1px)),
    repeating-linear-gradient(to bottom,transparent 0 calc(var(--ln) - 1.5px),var(--rule) calc(var(--ln) - 1.5px) var(--ln));
  background-position:0 0,0 0;
  border-radius:3px 3px 4px 4px;
  /* folhas de baixo aparecendo na borda */
  box-shadow:0 2px 0 -1px #fff,0 3px 0 -1px #C9D1DC,0 5px 0 -2px #fff,0 6px 0 -2px #BCC5D1,0 12px 22px rgba(30,40,60,.18);
  padding:var(--ln) 10px var(--ln) calc(var(--mg) + 8px)}
/* espiral à esquerda: um furo e um anel por linha da pauta */
.page::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:14px;
  background:radial-gradient(circle at 50% 50%,#7E8898 0 4.5px,#E3E8EF 5px 6px,transparent 6.5px) 0 0/14px var(--ln) repeat-y}
.page::after{content:"";position:absolute;left:-14px;top:0;bottom:0;width:34px;pointer-events:none;
  background:linear-gradient(to bottom,transparent 0 calc(var(--ln)/2 - 3px),#8E97A5 calc(var(--ln)/2 - 3px) calc(var(--ln)/2 - 1px),#F1F4F8 calc(var(--ln)/2 - 1px) calc(var(--ln)/2 + 1px),#7F8896 calc(var(--ln)/2 + 1px) calc(var(--ln)/2 + 3px),transparent calc(var(--ln)/2 + 3px)) 0 0/34px var(--ln) repeat-y;
  border-radius:0 8px 8px 0;-webkit-mask:linear-gradient(90deg,#000 0 60%,transparent 100%);mask:linear-gradient(90deg,#000 0 60%,transparent 100%)}
/* tudo dentro da folha: altura e margens em múltiplos da pauta */
.page *{margin:0}
.page p,.page li,.page h1,.page h2,.page label,.page span{line-height:var(--ln)}
.page h1{font-family:var(--hand);font-weight:400;font-size:34px;color:var(--ink)}
.page h2{font-family:var(--hand);font-weight:400;font-size:27px;color:var(--ink);display:flex;align-items:baseline;gap:10px}
.page h2 small{font-family:var(--ui);font-size:14px;color:var(--pencil)}
.page p,.muted{font-family:var(--hand);font-size:21px;color:var(--pencil)}
.page .gap{height:var(--ln)}
.block{margin-bottom:var(--ln)}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:6px;
  font-family:var(--hand);font-size:24px;line-height:1;background:var(--board);color:var(--chalk);
  box-shadow:0 4px 0 var(--wood-2);border:2px solid var(--wood);transition:transform .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-2)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.wide{width:100%}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--pencil);box-shadow:0 3px 0 #C7CCD6}
.btn.stop{background:var(--redpen);color:#fff;border:3px double #fff;outline:2px solid var(--redpen);box-shadow:0 4px 0 #8E1E17;font-size:30px;letter-spacing:.04em;height:56px;transform:rotate(-1deg)}
.btn.stop:active{transform:rotate(-1deg) translateY(3px)}
.btn.stop:disabled{transform:rotate(-1deg)}
/* botões dentro da folha cabem numa linha da pauta */
.page .btn{height:32px;font-size:20px;padding:0 12px;box-shadow:0 2px 0 var(--wood-2)}
.page .btn.ghost{box-shadow:0 2px 0 #C7CCD6}
.icon{width:42px;height:42px;border-radius:8px;display:grid;place-items:center;color:var(--chalk)}
.icon:hover{background:rgba(255,255,255,.1)}
.icon svg{width:22px;height:22px}

/* ---------- entrada ---------- */
#join{min-height:100dvh;display:grid;place-items:center;padding:36px 12px}
.joincard{width:min(460px,100%);margin-left:12px}
.wordmark{font-family:var(--hand);font-weight:400;font-size:64px!important;line-height:calc(var(--ln) * 2)!important;color:var(--redpen)!important;transform:rotate(-2deg);transform-origin:left bottom}
.lead{line-height:var(--ln)}
.field{display:block}
.field>span{display:block;font-weight:700;font-size:15px;color:var(--pencil);font-family:var(--ui)}
.inp{display:block;width:100%;height:var(--ln);padding:0 4px;border:0;background:transparent;font-family:var(--hand);font-size:27px;color:var(--pen);outline:none;border-radius:0}
.inp::placeholder{color:#AEB8C8}
.inp:focus{background:linear-gradient(to top,rgba(255,228,107,.4) 0 45%,transparent 45%)}
.swatches{display:flex;flex-wrap:wrap;gap:8px 10px;padding:4px 0}
.sw{width:32px;height:32px;border-radius:50%;background-color:#fff;background-image:repeating-linear-gradient(118deg,var(--c) 0 2px,transparent 2px 3.2px),repeating-linear-gradient(62deg,var(--c) 0 1.4px,transparent 1.4px 4px);box-shadow:inset 0 0 0 1.5px rgba(40,40,50,.55)}
.sw[aria-pressed="true"]{outline:2.5px solid var(--ink);outline-offset:2px}
.roomline{font-family:var(--ui)!important;font-size:15px!important}
.roomline a{color:var(--pen);font-weight:700}
.row{display:flex;gap:8px;align-items:center;height:var(--ln)}
.joincard .btn.wide{height:var(--ln);font-size:24px;box-shadow:0 3px 0 var(--wood-2)}

/* ---------- app ---------- */
#app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr)}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:4px;padding:0 6px 0 16px;padding-top:env(safe-area-inset-top);height:calc(var(--bar) + env(safe-area-inset-top));
  background:var(--board);color:var(--chalk);border-bottom:6px solid var(--wood);grid-column:1/-1;font-family:var(--hand)}
.bar .room{display:flex;align-items:center;gap:8px;font-size:23px;min-width:0}
.bar .room b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:10px;height:10px;border-radius:50%;background:#9AA6A2;flex:none}
.dot.on{background:#7BE0A4}
.bar .round{margin-left:auto;font-size:20px;opacity:.85;white-space:nowrap;padding-right:4px}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:50px;min-width:240px;background:var(--postit);color:var(--ink);padding:8px;box-shadow:2px 6px 14px rgba(0,0,0,.25);transform:rotate(1deg);z-index:30;font-family:var(--ui)}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:12px;border-radius:4px;text-align:left;font-weight:700}
.menu button:hover{background:rgba(0,0,0,.06)}
.menu button.armed{background:var(--redpen);color:#fff}
.menu hr{border:0;border-top:1.5px dashed rgba(0,0,0,.25);margin:4px 0}

/* jogadores: escritos numa linha da folha, cada um com sua bolinha de lápis de cor */
.players{display:flex;flex-wrap:nowrap;align-items:center;gap:6px 14px;height:var(--ln);overflow-x:auto;scrollbar-width:none;margin-bottom:var(--ln)}
.players::-webkit-scrollbar{display:none}
@media (min-width:700px){.players{flex-wrap:wrap;height:auto;padding:4px 0;row-gap:8px}.players .pl{height:32px}}
.pl{display:flex;align-items:center;gap:6px;flex:none;height:32px;padding:0 8px 0 2px;font-family:var(--hand);font-size:22px;line-height:1!important;color:var(--ink);border-radius:4px}
.pl.me{background:linear-gradient(to top,rgba(255,228,107,.75) 0 55%,transparent 55%)}
.pl.off{opacity:.45}
.pl .sc{font-size:22px;color:var(--redpen);line-height:1!important}
.pl .tag{font-size:15px;line-height:1!important}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--hand);font-size:17px;line-height:1!important;color:var(--ink);flex:none;background-color:#fff;background-image:repeating-linear-gradient(118deg,var(--c) 0 2px,transparent 2px 3.2px),repeating-linear-gradient(62deg,var(--c) 0 1.4px,transparent 1.4px 4px);box-shadow:inset 0 0 0 1.5px rgba(40,40,50,.55)}

.main{display:flex;flex-direction:column;min-width:0;padding:16px 8px 0 18px}
.page.sheet{flex:1;width:100%;max-width:780px;margin:0 auto 18px}
.action{position:sticky;bottom:0;z-index:10;margin:0 -10px 0 -22px;background:rgba(207,216,226,.92);backdrop-filter:blur(4px);padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.action:empty,.action .in:empty{display:none}
.action .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.action .hint{font-size:15px;color:var(--ink);text-align:center;margin:0;font-weight:700}
.action .two{display:flex;gap:10px}
.action .two .btn{flex:1}

@media (min-width:1000px){.main{padding:28px 24px 0 40px}}

/* ---------- configuração ---------- */
.invite{display:flex;gap:8px;align-items:center;height:var(--ln)}
.invite input{flex:1;min-width:0;border:0;background:none;font-size:14px;outline:none;color:var(--pencil);height:32px}
.cats{list-style:none;padding:0}
.cats li{display:flex;align-items:center;gap:2px;height:var(--ln);font-family:var(--hand);font-size:25px;color:var(--pen)}
.cats li span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cats li button{width:34px;height:32px;border-radius:6px;color:var(--pencil);font-size:17px;font-family:var(--ui)}
.cats li button:last-child{color:var(--redpen)}
.cats li button:hover{background:#F1F4F9}
/* chips: cada fileira ocupa exatamente uma linha da pauta */
.chips{display:flex;flex-wrap:wrap;gap:8px 8px;padding:4px 0}
.chip{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:999px;background:#F1F4F9;border:1.5px solid #D9DFE8;font-size:15px;line-height:1!important}
button.chip{background:var(--paper);border-style:dashed;color:var(--pen);font-weight:700}
button.chip:hover{background:var(--postit);border-style:solid}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:16px}
.grid2 label{display:grid;grid-template-rows:var(--ln) var(--ln);font-weight:700;font-size:14px;color:var(--pencil);min-width:0;font-family:var(--ui)}
.grid2 select,.grid2 input{height:var(--ln);padding:0 2px;border:0;border-radius:0;background:transparent;font-family:var(--hand);font-size:23px;color:var(--pen);width:100%;outline:none}
.check{display:flex;gap:10px;align-items:center;min-height:var(--ln);font-size:15px;font-family:var(--ui)}
.check span{line-height:1.25!important}
.check input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--okpen)}
.rules{padding:0;list-style:none}
.rules li{display:flex;justify-content:space-between;gap:12px;height:var(--ln);font-size:15px}
.rules li b{font-family:var(--hand);font-weight:400;font-size:23px;color:var(--pen);text-align:right;white-space:nowrap}
.small-note{font-family:var(--ui)!important;font-size:14px!important}

/* ---------- lousa com a letra ---------- */
.letterhero{display:flex;flex-direction:column;align-items:center;text-align:center}
.chalkboard{background:radial-gradient(circle at 30% 25%,#3A6E5F,var(--board) 60%,var(--board-2));border:12px solid var(--wood);border-radius:6px;box-shadow:inset 0 0 30px rgba(0,0,0,.35),0 6px 0 var(--wood-2);
  width:min(76vw,320px);height:calc(var(--ln) * 6);display:grid;place-items:center;position:relative;margin-bottom:var(--ln)}
.bigletter{font-family:var(--hand);font-size:170px;line-height:1;color:var(--chalk);text-shadow:0 0 1px #fff,0 0 8px rgba(255,255,255,.25)}
.bigletter.empty{opacity:.35}
.bigletter.rolling{opacity:.8}
.bigletter.hit{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.letterhero .cap{font-size:30px;color:var(--ink)}

/* ---------- planilha: tema na margem, resposta escrita na linha ---------- */
.sheethead{display:flex;align-items:center;gap:14px;height:calc(var(--ln) * 2)}
.lettertile{width:64px;height:60px;flex:none;display:grid;place-items:center;font-family:var(--hand);font-size:44px;line-height:1;background:var(--board);color:var(--chalk);border:5px solid var(--wood);border-radius:4px}
.sheethead .t{font-family:var(--hand);font-size:30px;line-height:var(--ln)}
.sheethead .sub{font-size:14px;line-height:1;color:var(--pencil)}
.timer{margin-left:auto;font-family:var(--hand);font-size:28px;line-height:40px;padding:0 12px;background:var(--postit);transform:rotate(2deg);box-shadow:1px 2px 4px rgba(0,0,0,.15)}
.timer.low{background:var(--redpen);color:#fff}
.fields{display:flex;flex-direction:column}
.fld{display:grid;grid-template-columns:minmax(84px,34%) minmax(0,1fr);align-items:center;column-gap:8px;height:var(--ln)}
.fld>span{font-size:13px;font-weight:700;color:var(--pencil);line-height:1.1!important;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fld .box{position:relative;min-width:0;height:var(--ln)}
.fld input{width:100%;height:var(--ln);padding:0 34px 0 2px;border:0;border-radius:0;background:transparent;font-family:var(--hand);font-size:27px;color:var(--pen);outline:none}
.fld input::placeholder{color:#B9C4D4}
.fld input:focus{background:linear-gradient(to top,rgba(255,228,107,.4) 0 46%,transparent 46%)}
.fld input:disabled{color:var(--pen);opacity:.75}
.fld .mk{position:absolute;right:4px;top:0;line-height:var(--ln)!important;transform:rotate(-8deg);font-family:var(--hand);font-size:30px}
.fld.ok .mk{color:var(--okpen)}
.fld.bad .mk{color:var(--redpen)}
.fld.bad input{text-decoration:underline wavy var(--redpen) 1.5px;text-underline-offset:5px}
@media (min-width:700px){.fld{grid-template-columns:190px minmax(0,1fr)}.fld>span{font-size:15px}}
.stopnote{padding:12px;background:var(--redpen);color:#fff;font-family:var(--hand);font-size:26px;text-align:center;border:3px double #fff;outline:2px solid var(--redpen);transform:rotate(-1deg)}

/* ---------- conferência: correção da professora ---------- */
.dictnote{display:inline-block}
.rvtheme{margin-bottom:var(--ln)}
.rvlist{list-style:none;padding:0}
.rvlist li{display:grid;grid-template-columns:minmax(44px,auto) minmax(0,1fr) auto auto;height:var(--ln);column-gap:8px;align-items:center}
.rvlist .who{font-size:13px;color:var(--pencil);font-weight:700;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--ui)}
.rvlist .w{font-family:var(--hand);font-size:27px;color:var(--pen);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rvlist li.bad .w{text-decoration:line-through 2px var(--redpen);color:#8C97AA}
.pts{font-family:var(--hand);font-size:22px;line-height:1!important;color:var(--redpen);border:2px solid var(--redpen);border-radius:50%;width:36px;height:34px;display:grid;place-items:center;justify-self:end;transform:rotate(-6deg)}
li.bad .pts{opacity:.55}
.rvmeta{grid-column:2/-1;display:flex;flex-wrap:nowrap;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.note{display:inline-flex;align-items:center;height:26px;font-size:13px;line-height:1!important;padding:0 8px;background:var(--postit);color:#5C4A00;box-shadow:1px 1px 2px rgba(0,0,0,.12);white-space:nowrap;font-family:var(--ui)}
.vote{display:inline-flex;align-items:center;justify-content:center;gap:3px;height:30px;min-width:40px;padding:0 7px;border-radius:6px;background:var(--paper);border:2px solid #C9CFDA;font-size:14px;line-height:1;font-weight:700;flex:none}
.note{font-size:12px!important;padding:0 6px!important}
@media (max-width:420px){.page h1{font-size:30px}}
.vote.on{background:var(--ink);border-color:var(--ink);color:#fff}
.totals{list-style:none;padding:0;display:flex;flex-wrap:wrap;column-gap:16px}
.totals li{font-size:15px;font-weight:700;font-family:var(--ui)}
.totals b{font-family:var(--hand);font-weight:400;font-size:26px;color:var(--redpen);margin-left:6px}

/* ---------- placar: boletim ---------- */
.winner{text-align:center}
.winner .crown{font-size:56px;line-height:calc(var(--ln) * 2)}
.winner .name{font-family:var(--hand);font-size:56px;line-height:calc(var(--ln) * 2);color:var(--pen)}
.winner .muted{font-size:24px;line-height:var(--ln);margin-bottom:var(--ln)}
.rank{list-style:none;padding:0}
.rank li{display:flex;align-items:center;gap:12px;height:var(--ln);font-weight:700}
.rank li>span:not(.av){line-height:var(--ln)}
.rank .pos{width:26px;text-align:center;font-family:var(--hand);font-size:24px;color:var(--pencil)}
.rank li:first-child .pos{color:var(--star)}

/* botão de entrar pintado a lápis de cor, com contorno desenhado à mão */

/* ===== botões no estilo do caderno: pintados a lápis, contorno desenhado à mão ===== */
.btn{background-color:#fff;color:#123524;font-family:var(--hand);font-size:26px;
  background-image:repeating-linear-gradient(118deg,rgba(28,154,94,.55) 0 1.6px,transparent 1.6px 4.6px),repeating-linear-gradient(64deg,rgba(28,154,94,.28) 0 1.2px,transparent 1.2px 5.5px);
  border:2.5px solid #24402F;border-radius:255px 14px 225px 14px/14px 225px 14px 255px;box-shadow:2px 3px 0 rgba(36,64,47,.35);
  text-shadow:0 0 4px #fff,0 0 8px #fff,0 0 2px #fff}

.btn:disabled{opacity:.45}
.btn.ghost{background-image:none;background-color:#fff;color:var(--ink);border:2px solid var(--pencil);border-radius:14px 225px 14px 255px/255px 14px 225px 14px;box-shadow:1px 2px 0 rgba(90,98,112,.3)}

/* ===== temas e sugestões escritos à mão, sem "pílulas" ===== */

/* ===== tudo à mão: a letra de mão também nos rótulos, dicas, menu e avisos ===== */
:root{--ui:"Patrick Hand","Comic Sans MS",cursive}
body{font-size:19px}
.field>span,.grid2 label{font-size:19px;font-weight:400}

.check input:checked::after{content:"✓";font-family:var(--hand);font-size:30px;line-height:1;color:var(--okpen);transform:rotate(-8deg) translate(2px,-4px)}

.letterpick .muted{margin-bottom:var(--ln)}

.lt{width:40px;height:var(--ln);display:grid;place-items:center;font-family:var(--hand);font-size:31px;line-height:1!important;color:var(--pen);position:relative;will-change:transform}

/* ===== cabeçalho da planilha: letra circulada à mão, duas linhas da pauta ===== */
.sheethead{display:grid;grid-template-columns:72px minmax(0,1fr) auto;grid-template-rows:var(--ln) var(--ln);column-gap:10px;align-items:center;height:calc(var(--ln) * 2)}
.lettertile{grid-row:1/3;justify-self:start;position:relative;width:68px;height:68px;display:grid;place-items:center;background:none;border:0;border-radius:0;transform:none;
  font-family:var(--hand);font-size:54px;line-height:1;color:var(--redpen)}

.page{border-top-left-radius:2px;border-bottom-left-radius:2px}

/* ===== folha virando ao trocar de fase ===== */
.flip{position:fixed!important;z-index:60;pointer-events:none;margin:0!important;transform-origin:0 50%;
  animation:pageturn .7s cubic-bezier(.5,.05,.35,1) forwards;will-change:transform}
.flip::marker{content:none}
.flip .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,0) 40%,rgba(20,30,45,.22));opacity:0;animation:pageshade .7s ease-in forwards;z-index:4}
@keyframes pageturn{
  0%{transform:perspective(1800px) rotateY(0deg);box-shadow:0 12px 22px rgba(30,40,60,.18)}
  55%{box-shadow:-30px 20px 40px rgba(30,40,60,.35)}

/* ===== folha dando a volta na espiral e se recolhendo atrás do caderno ===== */
.page.sheet{position:relative;z-index:1}
.flip2{position:fixed;z-index:60;pointer-events:none;transform-style:preserve-3d;transform-origin:0 50%;
  animation:pageround 1.1s cubic-bezier(.42,.02,.3,1) forwards}
.flip2 .face{position:absolute!important;inset:0;margin:0!important;min-height:0!important;width:100%!important;height:100%!important;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.flip2 .front::after{display:none!important}
.flip2 .back{transform:rotateY(180deg);border-radius:3px;
  background-color:#fbfcfd;background-image:repeating-linear-gradient(to bottom,transparent 0 calc(var(--ln) - 1.5px),rgba(191,213,238,.55) calc(var(--ln) - 1.5px) var(--ln))}
.flip2 .front .shade{background:linear-gradient(90deg,rgba(20,30,45,.05),rgba(20,30,45,.28));animation:shadeFront 1.1s ease-in forwards}
.flip2 .back .shade{position:absolute;inset:0;background:linear-gradient(270deg,rgba(20,30,45,.3),rgba(20,30,45,0) 60%);animation:shadeBack 1.1s ease-out forwards}
@keyframes pageround{
  0%{transform:perspective(1700px) rotateY(0deg);z-index:60}
  49%{z-index:60}
  50%{transform:perspective(1700px) rotateY(-180deg);z-index:0}
  100%{transform:perspective(1700px) rotateY(-345deg);z-index:0}}
@keyframes shadeFront{0%{opacity:0}45%{opacity:1}100%{opacity:1}}
@keyframes shadeBack{0%,45%{opacity:.2}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.flip2{display:none}}
/* dobra a folha para trás da espiral (cabe na tela do celular) */
.flip2{animation:pagefold .9s cubic-bezier(.4,.05,.35,1) forwards}
.flip2 .front .shade{animation:shadeFold .9s ease-in forwards}
@keyframes pagefold{
  0%{transform:perspective(1400px) rotateY(0deg);z-index:60}
  18%{transform:perspective(1400px) rotateY(-14deg);z-index:60}
  72%{z-index:60}
  73%{z-index:0}
  100%{transform:perspective(1400px) rotateY(96deg);z-index:0}}
@keyframes shadeFold{0%{opacity:0}18%{opacity:.15}100%{opacity:1}}

/* robôs na configuração */
.botadd{display:flex;gap:8px;height:var(--ln);align-items:center}
.botadd .btn{flex:1}

/* ===== virada de página: vem na direção de quem olha e passa por cima da espiral =====
   técnica: folha com frente e verso girando 180° pela lombada, luz falsa com degradê,
   leve levantada (translateZ) no meio do giro e sombra projetada na folha de baixo */
.flip2{animation:pageflip 1s cubic-bezier(.645,.045,.355,1) forwards;z-index:60}
@keyframes pageflip{
  0%  {transform:perspective(1500px) rotateY(0deg)    translateZ(0)}
  45% {transform:perspective(1500px) rotateY(-80deg)  translateZ(36px)}
  100%{transform:perspective(1500px) rotateY(-180deg) translateZ(0)}}
.flip2 .front .shade{background:linear-gradient(90deg,rgba(20,30,45,.30) 0%,rgba(20,30,45,.06) 35%,rgba(255,255,255,.18) 70%,rgba(20,30,45,.10) 100%);animation:lightFront 1s cubic-bezier(.645,.045,.355,1) forwards}
.flip2 .back .shade{background:linear-gradient(270deg,rgba(20,30,45,.35),rgba(20,30,45,0) 55%);animation:lightBack 1s cubic-bezier(.645,.045,.355,1) forwards}
@keyframes lightFront{0%{opacity:0}45%{opacity:1}100%{opacity:1}}
@keyframes lightBack{0%,45%{opacity:1}100%{opacity:.25}}
.flip2 .back{opacity:1;animation:backFade 1s linear forwards}
@keyframes backFade{0%,80%{opacity:1}100%{opacity:0}}
.flipshadow{position:fixed;z-index:59;pointer-events:none;background:linear-gradient(90deg,rgba(20,30,45,.38),rgba(20,30,45,.12) 35%,rgba(20,30,45,0) 70%);
  opacity:0;animation:castShadow 1s cubic-bezier(.645,.045,.355,1) forwards}

/* ===== ajustes de celular ===== */
/* barra de baixo: sombra leve em cima para separar do que rola por trás */
.page .action:not(.plain):not(.below){box-shadow:0 -9px 10px -9px rgba(34,40,58,.3)}
/* anfitrião na correção ("Tudo certo" + "Seguir"): um embaixo do outro, cada um numa linha da pauta */
@media (max-width:520px){
  .page .action .two{flex-direction:column;height:auto;gap:0;align-items:stretch}
  .page .action .two .btn{width:100%;flex:none}
}
/* nome do tema legível no celular: coluna do tema mais larga e letra maior (na folha e na correção) */
@media (max-width:520px){
  .fld{grid-template-columns:40% minmax(0,1fr);column-gap:6px}
  .fld>span{font-size:19px}
}
/* temas na configuração: área de toque do tamanho da linha e ✕ afastado do ↑ */
.cats li{gap:4px}
.cats li button{width:40px;height:40px}
.cats li button.rm{margin-left:8px}
.chip.undo{border-style:solid;background:var(--postit);color:var(--ink);font-family:var(--hand);font-size:19px;font-weight:400;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* aviso amarelo no celular: desce para a linha vazia abaixo dos jogadores, sem cobrir os nomes */
@media (max-width:820px){#toast{top:calc(var(--bar) + env(safe-area-inset-top) + 100px);padding:4px 14px;line-height:1.25}}
</style>
</head>
<body>

<div id="join">
  <div class="joincard page">
    <h1 class="wordmark">ESTOPE!</h1>
    <p class="lead">Stop online com a turma. Sorteie a letra, preencha e confira junto.</p>
    <label class="field"><span>Seu nome</span>
      <input id="nameIn" class="inp" maxlength="14" placeholder="Ex.: Júlia" autocomplete="off" enterkeyhint="go"></label>
    <div class="field"><span>Sua cor</span><div class="swatches" id="shirtSw" role="group" aria-label="Cor do jogador"></div></div>
    <p class="roomline" id="roomInfo"></p>
    <div id="roomBox" hidden>
      <label class="field"><span>Código da sala</span>
        <div class="row"><input id="roomIn" class="inp" maxlength="8" style="text-transform:uppercase;letter-spacing:2px;font-weight:700" autocomplete="off">
        <button class="btn ghost" id="newRoom" title="Gerar código" aria-label="Gerar código">🎲</button></div></label>
    </div>
    <button class="btn wide" id="enterBtn">Entrar na sala</button>
  </div>
</div>

<div id="app" hidden>
  <header class="bar">
    <div class="room"><span class="dot" id="conn" aria-hidden="true"></span><b id="roomName"></b></div>
    <span class="round num" id="roundInfo"></span>
    <button class="icon" id="copyBtn" aria-label="Convidar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></button>
    <div class="menuwrap">
      <button class="icon" id="menuBtn" aria-label="Mais opções" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
      <div class="menu" id="menu" hidden role="menu">
        <button id="restartBtn" role="menuitem" data-label="Recomeçar partida" data-icon="🔄" title="Recomeçar partida"><span class="mi">🔄</span> <span class="ml">Recomeçar partida</span></button>
        <button id="lobbyBtn" role="menuitem" data-label="Encerrar e voltar à configuração" data-icon="⚙️" title="Encerrar e voltar à configuração"><span class="mi">⚙️</span> <span class="ml">Encerrar e voltar à configuração</span></button>
        <hr id="menuSep">
        <button id="logoutBtn" role="menuitem" data-label="Sair da sala" data-icon="🚪" title="Sair da sala"><span class="mi">🚪</span> <span class="ml">Sair da sala</span></button>
      </div>
    </div>
  </header>
  <div class="main">
    <main class="page sheet">
      <div class="players" id="players" aria-label="Jogadores"></div>
      <div class="stage" id="stage"></div>
      <footer class="action" id="action"></footer>
    </main>
  </div>
</div>

<button id="more" class="more" hidden aria-label="Tem mais coisas abaixo. Rolar para baixo"><svg viewBox="0 0 28 34" width="22" height="27" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.2 3c-.6 4.5.8 8.2-.3 12.6-.8 3.6.4 7.3.1 11.6"/><path d="M6.5 20.2c2.6 2.4 5 5.1 7.6 9.4 2.2-4.1 4.8-7 7.6-9.6"/></svg></button>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">

/* ================= CONFIG ================= */
const SUPA_URL = 'https://smlhkifwlbqsvfsixkvo.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtbGhraWZ3bGJxc3Zmc2l4a3ZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTE2OTAsImV4cCI6MjEwODI2NzY5MH0.iV8A48oeS5qDdH362shNt0cZKaTTqFqszHKdRCcVnbY';
const NS = 'estope2';            // canal e chaves separados da versão oficial
const SHIRTS = ['#E0403A','#F08A24','#F2C230','#1C9A5E','#2347D6','#D94C9C'];
const SKINS  = ['#ffdfc4'];
const SHIRT_NAMES = {'#E0403A':'Vermelho','#F08A24':'Laranja','#F2C230':'Amarelo','#1C9A5E':'Verde','#2347D6':'Azul','#D94C9C':'Rosa'};
const KID_CATS = ['Nome','Animal','Fruta, Verdura ou Legume','Cor','Objeto','Profissão'];
const CATS_DEFAULT = ['Nome','CEP (Cidade, Estado, País)','Animal','Fruta, Verdura ou Legume','Cor','Objeto','Profissão','Marca'];
const PRESETS = ['Comida','Filme ou Série','Carro','Esporte','Parte do corpo','Time de futebol','Cantor ou Banda','Personagem','Coisa da escola','Adjetivo','Verbo','Instrumento musical','App ou Site','Jogo','Nome de pet','Minha sogra é...','Bebida','Novela','Super-herói','Doce ou Sobremesa'];
const ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= UTILS ================= */
const $ = s => document.querySelector(s);
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
function rid(n=8,abc='abcdefghijkmnpqrstuvwxyz23456789'){let s='';for(let i=0;i<n;i++)s+=abc[Math.floor(Math.random()*abc.length)];return s}
const roomCode = () => rid(5,'ABCDEFGHJKMNPQRSTUVWXYZ23456789');
function el(tag,props={},...kids){
  const e=document.createElement(tag);
  for(const k in props){const v=props[k];
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='style')e.style.cssText=v;
    else if(k==='value')e.value=v;
    else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}
  return e;
}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const titleCase = s => s.split(' ').map(w=>w.length>2?cap(w):w).join(' ');
let undoCat=null;   // último tema removido na configuração (para desfazer)
let toastT; function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
let AC; function beep(f=600,d=.08,type='square',vol=.05){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=vol;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch{}}
function inkFor(hex){const h=hex.replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return (r*299+g*587+b*114)/1000>150?'#172033':'#FFFFFF'}
function avatar(name,color){return el('span',{class:'av','aria-hidden':'true',style:'--c:'+color,text:(name||'?').trim().charAt(0).toUpperCase()})}

/* ================= IDENTITY / SESSÃO ================= */
const SESSION_MS=12*60*60*1000;
const loadSession=()=>{const s=store.get(NS+'-session',null);return s&&s.id&&s.room&&s.exp>Date.now()?s:null};
let session=loadSession();
let myId; try{myId=sessionStorage.getItem(NS+'-id')||session?.id||rid(10);sessionStorage.setItem(NS+'-id',myId)}catch{myId=session?.id||rid(10)}
const params=new URLSearchParams(location.search);
let room=(params.get('sala')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
const DEFAULT_ROOM='GERAL';
const roomUrl=()=>location.origin+location.pathname+(room&&room!==DEFAULT_ROOM?'?sala='+room:'');
const saveSession=()=>store.set(NS+'-session',{id:myId,room,exp:Date.now()+SESSION_MS});
let me={name:store.get('estope-name',''),shirt:SHIRTS.includes(store.get(NS+'-shirt',''))?store.get(NS+'-shirt'):SHIRTS[Math.floor(Math.random()*SHIRTS.length)],skin:SKINS[0]};
let joinedAt=Date.now();
function logout(){try{localStorage.removeItem(NS+'-session');localStorage.removeItem(NS+'-ans');sessionStorage.removeItem(NS+'-id')}catch{}
  try{ch&&ch.unsubscribe()}catch{}location.replace(roomUrl())}
const tabs=('BroadcastChannel' in window)?new BroadcastChannel(NS+'-tabs'):null;
tabs&&tabs.addEventListener('message',e=>{if(e.data?.q==='who'&&e.data.id===myId&&!$('#app').hidden)tabs.postMessage({a:'me',id:myId})});
const sessionBusy=()=>new Promise(res=>{if(!tabs)return res(false);const t=setTimeout(()=>{tabs.removeEventListener('message',h);res(false)},350);
  const h=e=>{if(e.data?.a==='me'&&e.data.id===myId){clearTimeout(t);tabs.removeEventListener('message',h);res(true)}};tabs.addEventListener('message',h);tabs.postMessage({q:'who',id:myId})});

/* ================= ENTRADA ================= */
function buildJoin(){
  $('#nameIn').value=me.name;
  const showRoomBox=on=>{$('#roomBox').hidden=!on;const info=$('#roomInfo');info.innerHTML='';
    if(on)info.append(el('a',{href:'#',text:'Voltar para a sala principal',onclick:e=>{e.preventDefault();$('#roomIn').value=DEFAULT_ROOM;showRoomBox(false)}}));
    else info.append('Sala principal. ',el('a',{href:'#',text:'Trocar de sala',onclick:e=>{e.preventDefault();$('#roomIn').value=roomCode();showRoomBox(true);$('#roomIn').focus()}}))};
  $('#roomIn').value=room||DEFAULT_ROOM;
  showRoomBox(!!room&&room!==DEFAULT_ROOM);
  const box=$('#shirtSw');const mk=()=>{box.innerHTML='';SHIRTS.forEach(c=>box.append(el('button',{class:'sw',style:'--c:'+c,'aria-label':'Cor '+(SHIRT_NAMES[c]||c),title:SHIRT_NAMES[c]||'','aria-pressed':String(me.shirt===c),onclick:()=>{me.shirt=c;mk()}})))};mk();
  $('#newRoom').onclick=()=>{$('#roomIn').value=roomCode()};
  $('#enterBtn').onclick=()=>enter();
  $('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
}
function enter(resume=false){
  const n=$('#nameIn').value.trim().slice(0,14);
  if(!n){$('#nameIn').focus();toast('Digite seu nome');return}
  const r=$('#roomBox').hidden?DEFAULT_ROOM:$('#roomIn').value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
  if(r.length<3){toast('O código da sala precisa de pelo menos 3 caracteres');return}
  me.name=n;room=r;joinedAt=Date.now();store.set('estope-name',n);store.set(NS+'-shirt',me.shirt);
  saveSession();setInterval(saveSession,5*60*1000);
  history.replaceState(null,'',roomUrl());
  beep(880,.05);
  if(!REDUCED&&!resume)turnPage($('#join .joincard'));
  $('#join').hidden=true;$('#app').hidden=false;
  $('#roomName').textContent=room===DEFAULT_ROOM?'Sala principal':'Sala '+room;
  connect();renderAll();
}

/* ================= REDE ================= */
let sb=null;
// já abre a conexão com o servidor enquanto a pessoa digita o nome
const sbReady=import('https://esm.sh/@supabase/supabase-js@2.45.4/es2022/supabase-js.bundle.mjs').then(m=>{sb=m.createClient(SUPA_URL,SUPA_KEY,{realtime:{params:{eventsPerSecond:20}}});try{sb.realtime.connect()}catch{}return sb});
let ch=null,connected=false;
let presence={};
let hostId=null;
let state=null;
const amHost=()=>hostId===myId;
// Dimas, Duda ou Mado na sala: o primeiro deles que entrou é o anfitrião (começar, configurar, seguir, recomeçar).
// Sem nenhum deles, é quem chegou primeiro. O "anfitrião técnico" (quem guarda o jogo) continua sendo quem chegou primeiro.
const LEADERS=['dimas','duda','mado'];
function leaderId(){const ls=Object.values(presence).filter(m=>!isBot(m.id)&&LEADERS.includes(norm(m.name))).sort((a,b)=>a.joinedAt-b.joinedAt||(a.id<b.id?-1:1));
  return ls[0]?.id||hostId}
const isLeader=id=>id===leaderId();
const iLead=()=>isLeader(myId);
const myMeta=()=>({id:myId,name:me.name,shirt:me.shirt,skin:me.skin,joinedAt});
function send(event,payload){if(ch&&connected)ch.send({type:'broadcast',event,payload}).catch(()=>{})}
async function connect(){
  try{await sbReady}catch{toast('Sem conexão. Atualize a página');return}
  ch=sb.channel(NS+'-'+room,{config:{broadcast:{self:false},presence:{key:myId}}});
  ch.on('presence',{event:'sync'},onPresence);
  ch.on('broadcast',{event:'state'},({payload})=>onState(payload));
  ch.on('broadcast',{event:'act'},({payload:p})=>{if(amHost()&&p&&p.from)handleAction(p.from,p.type,p.data||{})});
  ch.on('broadcast',{event:'hello'},()=>{if(amHost())pushState(false)});
  ch.on('broadcast',{event:'fx'},({payload:p})=>{
    if(p?.t==='stop')beep(220,.5,'sawtooth',.06);
    if(p?.t==='restart'){myAnswers={};toast('A partida foi recomeçada')}
    if(p?.t==='lobby'){myAnswers={};toast('Partida encerrada. De volta à configuração')}});
  ch.subscribe(async st=>{
    if(st==='SUBSCRIBED'){connected=true;$('#conn').classList.add('on');await ch.track(myMeta());send('hello',{})}
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){connected=false;$('#conn').classList.remove('on');if(st!=='CLOSED')toast('Conexão instável. Tentando de novo…')}
  });
  setInterval(()=>{if(amHost()&&state)pushState(false)},4000);
}
let wakeLock=null,wantAwake=false;
async function keepAwake(on){wantAwake=on;try{
  if(on&&!wakeLock&&'wakeLock' in navigator&&document.visibilityState==='visible'){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}
  else if(!on&&wakeLock){const w=wakeLock;wakeLock=null;await w.release()}}catch{}}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){if(wantAwake)keepAwake(true);return}
  // anfitrião saiu do jogo (bloqueou a tela ou trocou de app) no meio da partida:
  // passa o comando para o próximo jogador para a rodada não travar
  if(ch&&connected&&state&&amHost()&&!['lobby','end'].includes(state.phase)&&Object.keys(presence).length>1){
    pushState(false);joinedAt=Date.now();ch.track(myMeta()).catch(()=>{})}});
function onPresence(){
  const ps=ch.presenceState();const np={};
  for(const k in ps){const m=ps[k]&&ps[k][0];if(m&&m.id)np[m.id]=m}
  np[myId]=myMeta();
  // nome repetido na sala: quem chegou depois volta para a tela inicial para escolher outro
  const mine=norm(me.name),dup=Object.values(np).find(m=>m.id!==myId&&norm(m.name)===mine&&(m.joinedAt<joinedAt||(m.joinedAt===joinedAt&&m.id<myId)));
  if(dup){try{sessionStorage.setItem(NS+'-dup',me.name)}catch{}logout();return}
  for(const id in np)if(!presence[id]&&id!==myId&&state)toast(`${np[id].name} entrou na sala`);
  presence=np;
  const order=Object.values(presence).sort((a,b)=>a.joinedAt-b.joinedAt||(a.id<b.id?-1:1));
  const was=amHost();hostId=order[0].id;
  if(was&&!amHost())clearTimers();   // deixou de ser anfitrião: os relógios antigos não podem mais avançar o jogo nesta tela
  if(amHost()){
    if(!state)state=freshState();
    if(!was){state.by=myId;rearmTimers()}
    syncPlayers();checkAllOk();                                   // quem saiu não trava a correção
  }
  renderAll();
}
function onState(p){
  if(!p||amHost())return;
  if(p.by!==hostId&&state)return;
  const prev=state;state=p;onStateChange(prev);
}
function pushState(rerender=true){state.v=(state.v||0)+1;state.by=myId;send('state',state);if(rerender)onStateChange(lastLocal)}
let lastLocal=null;

/* ================= LÓGICA DO ANFITRIÃO ================= */
let hostAnswers={};
let timers={};
function freshState(){return{v:0,by:myId,phase:'lobby',config:{cats:[...CATS_DEFAULT],rounds:5,time:0,rule:'any',bonus:false,exclude:'KWY'},players:{},round:0,turn:-1,spinner:null,letter:null,used:[],spin:null,stopBy:null,review:null,last:null,playDur:0,bots:{}}}
/* ===== robôs ===== */
const BOT_LEVELS={bom:{name:'Robô Bom',fill:.45,color:'#1C9A5E'},medio:{name:'Robô Médio',fill:.7,color:'#F08A24'},otimo:{name:'Robô Ótimo',fill:.95,color:'#7B4FD6'}};
const isBot=id=>!!state?.bots?.[id];
const isOn=id=>!!presence[id]||isBot(id);
function onlineOrder(){const humans=Object.values(presence).sort((a,b)=>a.joinedAt-b.joinedAt||(a.id<b.id?-1:1)).map(m=>m.id);
  const bots=Object.keys(state?.bots||{}).sort((a,b)=>(state.players[a]?.joinedAt||0)-(state.players[b]?.joinedAt||0));return[...humans,...bots]}
function botAnswers(level){const p=BOT_LEVELS[level]?.fill||.5,a={};
  for(const c of state.config.cats){const ex=examplesFor(c,state.letter);if(ex.length&&Math.random()<p)a[c]=ex[Math.floor(Math.random()*ex.length)]}return a}
function scheduleBotSpin(){clearTimeout(timers.botspin);if(state?.phase==='spin'&&isBot(state.spinner)){const id=state.spinner;timers.botspin=setTimeout(()=>handleAction(id,'spin',{}),1800+Math.random()*1200)}}
function scheduleBotStop(){clearTimeout(timers.botstop);if(state?.phase!=='play')return;
  for(const id in state.bots||{}){if(state.bots[id].level!=='otimo')continue;const a=hostAnswers[id]||{};
    const ok=state.config.rule==='all'?state.config.cats.every(c=>norm(a[c]).startsWith(state.letter.toLowerCase())):Object.keys(a).length>0;
    if(ok){timers.botstop=setTimeout(()=>{if(state.phase==='play')doStop(id)},(30+Math.random()*20)*1000);return}}}
function syncPlayers(){
  for(const id in presence){const m=presence[id];const p=state.players[id];
    if(!p)state.players[id]={name:m.name,shirt:m.shirt,skin:m.skin,score:0,joinedAt:m.joinedAt};
    else if(p.name!==m.name||p.shirt!==m.shirt){p.name=m.name;p.shirt=m.shirt;p.skin=m.skin}}
  if(state.phase==='spin'&&state.spinner&&!isOn(state.spinner)){pickSpinner();scheduleBotSpin()}
  pushState();
}
function pickSpinner(){const o=onlineOrder();state.turn=(state.turn+1)%o.length;state.spinner=o[state.turn]}
// na correção, cada jogador (gente) que jogou a rodada aperta "Tudo certo"; quando todos apertarem, os pontos valem.
// Quem saiu um instante (pesquisa no Google, tela apagada) continua contando: se alguém sumir de vez, o anfitrião usa "Seguir".
const approvers=rv=>rv.order.filter(p=>!isBot(p));
function checkAllOk(){if(!amHost()||state?.phase!=='review'||!state.review?.dictDone)return;const rv=state.review,need=approvers(rv);
  if(need.length&&need.every(p=>rv.ok?.[p]))handleAction(myId,'confirm')}
function nextTurn(){state.round++;pickSpinner();state.phase='spin';state.letter=null;state.review=null;state.stopBy=null;state.spin=null;hostAnswers={};pushState();scheduleBotSpin()}
function clearTimers(){for(const k in timers)clearTimeout(timers[k]);timers={}}
function rearmTimers(){
  clearTimers();if(!state)return;
  if(state.phase==='spinning')timers.spin=setTimeout(()=>finishSpin(state.spin?.id),2500);
  if(state.phase==='play'&&state.playDur)timers.time=setTimeout(()=>doStop(null),Math.max(5000,state.playDur*1000-(Date.now()-(state.playStartedAt||Date.now()))));
  if(state.phase==='stopping')timers.fin=setTimeout(finishRound,3000);
  if(state.phase==='review'&&state.review)runDictionary(state.review.id);
  scheduleBotSpin();scheduleBotStop();
}
function wheelLetters(cfg){const ex=new Set((cfg?.exclude||'').toUpperCase().replace(/[^A-Z]/g,'').split(''));const l=ALPHA.filter(x=>!ex.has(x));return l.length?l:ALPHA}
function sanitizeAnswers(a){const o={};if(!a||typeof a!=='object')return o;for(const c of state.config.cats){const v=a[c];if(typeof v==='string')o[c]=v.slice(0,40)}return o}
function resetGame(){for(const id in state.players)state.players[id].score=0;state.round=0;state.used=[];state.turn=-1;state.last=null;state.review=null;state.spin=null;state.letter=null;state.stopBy=null;state.game=(state.game||0)+1;state.history=[]}
function handleAction(from,type,d){
  if(!state)return;const H=isLeader(from);
  switch(type){
  case 'config': if(!H||state.phase!=='lobby')return;{

function autoCheck(raw,letter){
  const n=norm(raw);if(!n)return'empty';
  if(n[0]!==letter.toLowerCase())return'letter';
  if(n.replace(/ /g,'').length<2)return'short';
  if(/(.)\1\1/.test(n)||/[^aeiouy ]{5,}/.test(n)||n.split(' ').some(w=>w.length>2&&!/[aeiouy]/.test(w)))return'gibberish';
  return'ok';
}
const dkey=raw=>String(raw).trim().toLowerCase().replace(/\s+/g,' ');
// "a abelha", "o urso", "uma uva": o artigo da frente não conta
const core=raw=>String(raw||'').trim().replace(/^(o|a|os|as|um|uma|uns|umas)\s+(?=\S)/i,'');
// formas no singular para procurar no dicionário (gatos→gato, leões→leão, animais→animal, flores→flor)
function singulars(w){const out=[],r=[[/ões$/,'ão'],[/ães$/,'ão'],[/ais$/,'al'],[/éis$/,'el'],[/óis$/,'ol'],[/uis$/,'ul'],[/res$/,'r'],[/zes$/,'z'],[/ses$/,'s'],[/ns$/,'m'],[/s$/,'']];
  if(w.length>3)for(const[a,b]of r)if(a.test(w)){out.push(w.replace(a,b));if(b!=='')break}
  return[...new Set(out)].filter(x=>x&&x!==w)}
// chave para achar repetidas: sem acento, sem maiúscula e no singular ("Pão" = "pao" = "pães")
const gkey=n=>n.split(' ').map(t=>t.length>3?t.replace(/oes$/,'ao').replace(/aes$/,'ao').replace(/ais$/,'al').replace(/eis$/,'el').replace(/res$/,'r').replace(/zes$/,'z').replace(/ns$/,'m').replace(/([^s])s$/,'$1'):t).join(' ');
function finishRound(){

  const pids=new Set([...Object.keys(hostAnswers),...Object.keys(presence),...Object.keys(state.bots||{})]);
  const order=[...pids].sort((a,b)=>(state.players[a]?.joinedAt||0)-(state.players[b]?.joinedAt||0));
  const rows={},names={},dict={};
  for(const pid of order){rows[pid]={};names[pid]=state.players[pid]?.name||presence[pid]?.name||'?';const a=hostAnswers[pid]||{};
    for(const c of cats){const w=(a[c]||'').trim(),cw=core(w),n=norm(cw),k=dkey(cw);const st=autoCheck(cw,letter);rows[pid][c]={w,n,g:gkey(n),k,a:st};if(st==='ok')dict[k]='pending'}}

  state.phase='review';pushState();runDictionary(state.review.id);
}
// cada consulta tem tempo limite: internet lenta nunca deixa a palavra presa em "verificando…"
async function getJSON(url,ms=7000){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms);
  try{return await (await fetch(url,{signal:ac.signal})).json()}finally{clearTimeout(t)}}
async function existing(host,titles){
  const out=new Set(),chunks=[];for(let i=0;i<titles.length;i+=45)chunks.push(titles.slice(i,i+45));
  await Promise.all(chunks.map(async chunk=>{
    const q=(await getJSON(`https://${host}/w/api.php?action=query&format=json&origin=*&redirects=1&titles=${encodeURIComponent(chunk.join('|'))}`)).query||{};
    const nm={},rd={};(q.normalized||[]).forEach(x=>nm[x.from]=x.to);(q.redirects||[]).forEach(x=>rd[x.from]=x.to);
    const ex=new Set(Object.values(q.pages||{}).filter(p=>!('missing' in p)&&!('invalid' in p)).map(p=>p.title));
    for(const t of chunk){let x=nm[t]||t;x=rd[x]||x;if(ex.has(x))out.add(t)}}));
  return out;
}
// procura ignorando acentos: "pao" acha "pão", "agua" acha "água"
async function searchFolded(host,word){
  const j=await getJSON(`https://${host}/w/api.php?action=query&format=json&origin=*&list=search&srnamespace=0&srlimit=10&srsearch=${encodeURIComponent(word)}`);
  const ns=new Set([word,...singulars(word)].map(norm));
  return (j.query?.search||[]).some(x=>ns.has(norm(x.title))||ns.has(norm(x.title.replace(/\s*\(.*\)$/,''))))}
let dictBusy=null;
async function runDictionary(rid_){
  const rv=state.review;if(!rv||rv.id!==rid_||rv.dictDone||dictBusy===rid_)return;
  const words=Object.keys(rv.dict).filter(k=>rv.dict[k]==='pending');
  if(!words.length){rv.dictDone=true;pushState();return}
  dictBusy=rid_;const result={},forms=w=>[w,...singulars(w)];
  const work=(async()=>{
    // Wikcionário e Wikipédia ao mesmo tempo, com a palavra e o singular dela
    const t1=[],t2=[];words.forEach(w=>forms(w).forEach(f=>{t1.push(f,cap(f));t2.push(cap(f),titleCase(f))}));
    const [f1,f2]=await Promise.all([existing('pt.wiktionary.org',[...new Set(t1)]).catch(()=>new Set()),existing('pt.wikipedia.org',[...new Set(t2)]).catch(()=>new Set())]);
    words.forEach(w=>{if(forms(w).some(f=>f1.has(f)||f1.has(cap(f))||f2.has(cap(f))||f2.has(titleCase(f))))result[w]='found'});
    // mesma palavra com e sem acento: se uma foi achada, a outra também vale
    const ok=new Set(words.filter(w=>result[w]).map(w=>gkey(norm(w))));
    words.forEach(w=>{if(!result[w]&&ok.has(gkey(norm(w))))result[w]='found'});
    // o resto: busca ignorando acentos nos dois sites ao mesmo tempo
    const miss=words.filter(w=>!result[w]).slice(0,30);
    await Promise.all(miss.map(async w=>{const r=await Promise.allSettled([searchFolded('pt.wiktionary.org',w),searchFolded('pt.wikipedia.org',w)]);
      if(r.some(x=>x.value===true))result[w]='found'}));
    words.forEach(w=>{if(!result[w])result[w]='missing'});
  })();
  // no máximo 15 s: o que não deu tempo de conferir vale normalmente (os jogadores ainda podem votar)
  let ended=false;await Promise.race([work.then(()=>ended=true).catch(()=>{}),new Promise(r=>setTimeout(r,15000))]);
  if(dictBusy===rid_)dictBusy=null;
  if(!state.review||state.review.id!==rid_||state.review.dictDone)return;
  for(const w of words)state.review.dict[w]=ended?(result[w]||'unknown'):(result[w]==='found'?'found':'unknown');
  state.review.dictDone=true;pushState();
}

function cellStatus(rv,pid,cat){
  const c=rv.rows[pid]?.[cat];if(!c||c.a==='empty')return{valid:false,why:'',fixed:true};
  if(c.a==='letter')return{valid:false,why:'letra errada',fixed:true};
  const d=rv.dict[c.k||dkey(c.w)];
  let base=c.a==='ok'&&d!=='missing';
  let why=c.a==='short'?'curta demais':c.a==='gibberish'?'parece inventada':d==='missing'?'fora do dicionário':d==='pending'?'verificando…':'';
  const vs=rv.votes[pid+'|'+cat]||{};let y=0,n=0;for(const v in vs){if(v===pid)continue;vs[v]==='yes'?y++:n++}
  const valid=n>y?false:y>n?true:base;
  return{valid,why,y,n,fixed:false};
}
function computePoints(rv,cfg){
  const cell={},total={};rv.order.forEach(p=>{cell[p]={};total[p]=0});
  for(const cat of rv.cats){
    const st={},groups={};let validCount=0;
    for(const pid of rv.order){const s=cellStatus(rv,pid,cat);st[pid]=s;if(s.valid){validCount++;const r=rv.rows[pid][cat],k=r.g||r.n;(groups[k]=groups[k]||[]).push(pid)}}
    for(const pid of rv.order){const s=st[pid];let pts=0;
      if(s.valid){const r=rv.rows[pid][cat],k=groups[r.g||r.n].length;pts=k===1?((cfg.bonus&&validCount===1)?20:10):Math.round(10/k);s.shared=k}
      s.pts=pts;cell[pid][cat]=s;total[pid]+=pts}}
  return{cell,total};
}

  const pg=document.querySelector('.page.sheet');if(pg){   // no meio da faixa branca entre a espiral e a margem vermelha
    const mg=parseFloat(getComputedStyle(pg).getPropertyValue('--mg'))||48,SPIRAL=28;
    m.style.left=Math.max(4,pg.getBoundingClientRect().left+(SPIRAL+mg)/2-m.offsetWidth/2)+'px'}}

function bringToTop(inp){if(!smallScreen())return;const row=inp.closest('.fld,li,label,.row,.invite')||inp;
  const first=row.matches('.fld')&&row===document.querySelector('.fld');   // 1º tema: sobe 2 linhas a mais para a letra circulada aparecer
  // deixa 1 linha acima à vista (o tema anterior), para não perder o contexto com o teclado aberto
  const target=()=>{const bar=document.querySelector('.bar').getBoundingClientRect().bottom;return Math.max(0,row.getBoundingClientRect().top+scrollY-bar-6-(first?80:LN))};
  topT.forEach(clearTimeout);

function renderAction(){
  const A=$('#action');A.innerHTML='';if(!state)return;
  const ph=state.phase,H=iLead(),inn=el('div',{class:'in'});
  if(ph==='lobby'){
    if(H)inn.append(el('button',{class:'btn wide',text:'Começar partida',onclick:()=>act('start')}));
    else inn.append(el('p',{class:'hint',text:`Aguardando ${nameOf(leaderId())} começar`}));
  }else if(ph==='spin'){
    if(state.spinner===myId)inn.append(el('button',{class:'btn wide',text:'Sortear letra',onclick:()=>act('spin')}));
    else inn.append(el('p',{class:'hint',text:`${nameOf(state.spinner)} vai sortear a letra`}));
  }else if(ph==='spinning'){inn.append(el('p',{class:'hint',text:'Sorteando…'}));

  }else if(ph==='stopping'){

  }else if(ph==='review'){
    const rv=state.review,need=rv?approvers(rv):[],done=need.filter(p=>rv.ok?.[p]),miss=need.filter(p=>!rv.ok?.[p]);
    const who=ids=>ids.map(p=>p===myId?'você':nameOf(p)+(presence[p]?'':' (fora)')).join(', ');
    const go=el('button',{class:'btn',text:'Seguir ➜',title:'Seguir sem esperar todo mundo',onclick:()=>act('confirm')});
    if(H&&rv){   // anfitrião: sempre pode seguir, mesmo sem todos darem tudo certo

        :el('button',{class:'btn ghost',text:'Quero rever',onclick:()=>act('ok',{val:false})});
      const others=miss.filter(p=>p!==myId);
      inn.append(el('p',{class:'hint',text:!rv.dictDone?'Conferindo as palavras no dicionário…':others.length?`Esperando ${who(others)}`:need.includes(myId)&&!rv.ok?.[myId]?'Só falta você':'Todos deram tudo certo'}),el('div',{class:'two'},mine,go));
    }
    else if(!rv||!rv.dictDone)inn.append(el('p',{class:'hint',text:'Conferindo as palavras no dicionário…'}));

    else if(!rv.ok?.[myId])inn.append(el('button',{class:'btn wide',text:`Tudo certo ✓ (${done.length} de ${need.length})`,onclick:()=>act('ok',{val:true})}));
    else inn.append(el('p',{class:'hint',text:`Esperando ${who(miss)}`}),el('button',{class:'btn wide ghost',text:'Quero rever',onclick:()=>act('ok',{val:false})}));
  }else if(ph==='scores'){
    if(H){const o=onlineOrder();const nx=o[(state.turn+1)%o.length];
      inn.append(el('p',{class:'hint',text:nx===myId?'Você sorteia a próxima letra':`${nameOf(nx)} sorteia a próxima letra`}),el('button',{class:'btn wide',text:'Próxima rodada',onclick:()=>act('next')}))}
    else inn.append(el('p',{class:'hint',text:`Aguardando ${nameOf(leaderId())} seguir`}));
  }else if(ph==='end'){
    if(H)inn.append(el('div',{class:'two'},el('button',{class:'btn ghost',text:'Mudar temas',onclick:()=>act('lobby')}),el('button',{class:'btn',text:'Jogar de novo',onclick:()=>act('start')})));

function examplesFor(cat,letter){const raw=EXAMPLES[norm(cat)];if(!raw)return[];
  const part=raw.split('|').find(p=>p[0]===letter);return part?part.slice(2).split(','):[]}
let exI=0;setInterval(()=>{const els=document.querySelectorAll('.ex[data-ex]');if(!els.length)return;exI++;
  els.forEach(e=>{const l=e.dataset.ex.split(',');const t=e.querySelector('.exw');if(!t)return;t.classList.add('out');
    setTimeout(()=>{t.textContent=l[exI%l.length];t.classList.remove('out')},220)})},1800);

const gsearch=(w,cat)=>'https://www.google.com/search?q='+encodeURIComponent(`${core(w)} ${cat.match(/\(([^)]+)\)/)?.[1]||cat}`);
function reviewView(){
  const rv=state.review,f=el('div');if(!rv)return f;
  const res=computePoints(rv,state.config);
  f.append(el('h1',{text:`Correção da letra ${rv.letter}`}),
    el('p',{class:'muted',text:'Toque em ✓ ou ✗ nas palavras dos outros. Na dúvida, toque na palavra para pesquisar no Google.'}),
    el('p',{class:'legend'},el('span',{class:'lg'},el('span',{class:'mark ok',text:'✓'}),'vale'),el('span',{class:'lg'},el('span',{class:'mark no',text:'✗'}),'não vale'),
      el('span',{class:'lg'},el('span',{class:'badge',text:'×2'}),'repetida'),el('span',{class:'lg'},el('span',{class:'badge q',text:'?'}),'fora do dicionário')));
  if(!rv.dictDone)f.append(el('p',{},el('span',{class:'note',text:'Verificando palavras no dicionário…'})));
  // matriz: temas nas linhas, jogadores nas colunas, uma linha da pauta por tema
  const tbl=el('table',{class:'mx'});
  tbl.append(el('thead',{},el('tr',{},el('th',{class:'cat',scope:'col',text:'Tema'}),
    rv.order.map(pid=>el('th',{scope:'col',class:pid===myId?'me':''},avatar(rv.names[pid],colorOf(pid)),el('span',{class:'nm',text:pid===myId?'Você':rv.names[pid]}),rv.ok?.[pid]?el('span',{class:'okmk',title:'Deu tudo certo',text:' ✓'}):'')))));
  const tb=el('tbody');
  for(const cat of rv.cats){
    const tr=el('tr',{},el('th',{class:'cat',scope:'row',title:cat},el('span',{class:'cl',text:cat})));
    for(const pid of rv.order){const c=rv.rows[pid][cat],s=res.cell[pid][cat];
      // célula em 3 colunas fixas: palavra | pontos | votos — assim os pontos ficam alinhados e o total cai embaixo deles
      const exs=!c.w?examplesFor(cat,rv.letter):[];
      const wb=el('span',{class:'wb'},exs.length?el('span',{class:'ex','data-ex':exs.join(','),title:'Exemplos: '+exs.join(', ')},el('span',{class:'exl',text:'ex.'}),el('span',{class:'exw',text:exs[exI%exs.length]})):c.w?el('a',{class:'w gq',href:gsearch(c.w,cat),target:'_blank',rel:'noopener',title:`Pesquisar “${c.w}” (${cat}) no Google`,text:c.w}):el('span',{class:'w',text:'—'}));
      if(s.shared>1)wb.append(el('span',{class:'badge',title:`Repetida por ${s.shared}`,text:'×'+s.shared}));
      if(s.why){const dic=s.why==='fora do dicionário';const wait=s.why==='verificando…';wb.append(el('span',{class:'badge'+(dic?' q':wait?' w':' x'),title:s.why,text:dic?'?':wait?'…':'!'}))}
      const pts=el('span',{class:'pts num',text:(s.pts>0?'+':'')+s.pts});
      let vs=el('span',{class:'vpair'});
      if(!s.fixed&&pid!==myId){const mv=(rv.votes[pid+'|'+cat]||{})[myId];
        vs.append(el('button',{class:'vm ok'+(mv==='yes'?' on':''),'aria-pressed':String(mv==='yes'),'aria-label':`Vale (${s.y||0} votos)`,title:`Vale (${s.y||0})`,onclick:()=>act('vote',{pid,cat,val:mv==='yes'?null:'yes'})},'✓'),
          el('button',{class:'vm no'+(mv==='no'?' on':''),'aria-pressed':String(mv==='no'),'aria-label':`Não vale (${s.n||0} votos)`,title:`Não vale (${s.n||0})`,onclick:()=>act('vote',{pid,cat,val:mv==='no'?null:'no'})},'✗'))}
      else if(!s.fixed&&(s.y||s.n))vs.append(el('span',{class:'vcount'},el('span',{class:'mark ok',text:'✓'}),String(s.y),el('span',{class:'mark no',text:'✗'}),String(s.n)));
      tr.append(el('td',{class:'cell'+(s.valid?'':' bad')+(pid===myId?' me':'')},el('div',{class:'ln'},wb,pts,vs)))}
    tb.append(tr)}
  tbl.append(tb,el('tfoot',{},el('tr',{},el('th',{class:'cat',scope:'row',text:'Total'}),
    rv.order.map(pid=>el('td',{class:'tot'+(pid===myId?' me':'')},el('div',{class:'ln'},el('span',{}),el('span',{class:'totn num',text:res.total[pid]}),el('span',{})))))));
  f.append(...mxBox(tbl));

}
function scoresView(){
  const f=el('div'),end=state.phase==='end';
  const hist=state.history||[];
  const list=Object.entries(state.players).map(([id,p])=>({id,...p})).filter(p=>isOn(p.id)||p.score>0).sort((a,b)=>b.score-a.score||(a.joinedAt||0)-(b.joinedAt||0)||(a.id<b.id?-1:1));
  list.forEach((p,i)=>p.rank=i&&p.score===list[i-1].score?list[i-1].rank:i+1);
  if(end&&list[0]){const top=list.filter(p=>p.rank===1),meWon=top.some(p=>p.id===myId);
    f.append(el('div',{class:'winner'},el('div',{class:'crown',text:top.length>1?'🤝':'🏆'}),
      el('div',{class:'name',text:top.length>1?'Empate!':meWon?'Você venceu!':list[0].name}),
      el('div',{class:'muted num',text:top.length>1?top.map(p=>p.id===myId?'Você':p.name).join(' e ')+` com ${list[0].score} pontos`:`${list[0].score} pontos`})));
    // pódio desenhado
    const pod=el('div',{class:'podium'});const M=['🥇','🥈','🥉'];
    [2,1,3].forEach(r=>{const ps=list.filter(p=>p.rank===r);if(!ps.length)return;
      pod.append(el('div',{class:'step s'+r},el('div',{class:'who'},ps.map(p=>el('span',{class:'pw'},avatar(p.name,colorOf(p.id)),el('span',{class:'pn',text:p.id===myId?'Você':p.name})))),
        el('div',{class:'base'},el('span',{class:'md',text:M[r-1]}),el('span',{class:'num',text:ps[0].score}))))});
    f.append(pod)}
  else f.append(el('h1',{text:'Boletim'}),el('p',{class:'muted',text:`Depois da rodada ${state.last?.round||state.round} de ${state.config.rounds}`}));
  const tbl=el('table',{class:'mx sb'});
  tbl.append(el('thead',{},el('tr',{},el('th',{class:'cat',scope:'col',text:'Jogador'}),
    hist.map(h=>el('th',{class:'rd',scope:'col',title:`Rodada ${h.round}, letra ${h.letter}`},el('span',{class:'rl',text:h.letter}),el('small',{text:h.round+'ª'}))),
    el('th',{class:'tt',scope:'col',text:'Total'}))));
  const tb=el('tbody');
  list.forEach((p,i)=>{
    tb.append(el('tr',{class:(p.id===myId?'me ':'')+(p.rank===1?'first':'')},
      el('th',{class:'cat',scope:'row'},el('span',{class:'pl2'},el('span',{class:'pos num',text:p.rank}),avatar(p.name,colorOf(p.id)),el('span',{class:'nm',text:p.name}))),
      hist.map(h=>{const g=h.gain?.[p.id];return el('td',{class:'rd num'+(g==null?' none':'')},g==null?'–':String(g))}),
      el('td',{class:'tt num',text:p.score})))});
  tbl.append(tb);
  f.append(...mxBox(tbl));
  return f;
}

/* ---------- sorteio: embaralha as letras da folha e circula a escolhida ---------- */
function shuffleGrid(g){
  const items=[...g.children];const before=new Map(items.map(n=>[n,n.getBoundingClientRect()]));
  for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}
  items.forEach(n=>g.append(n));
  items.forEach(n=>{const a=before.get(n),b=n.getBoundingClientRect();const dx=a.left-b.left,dy=a.top-b.top;
    if(dx||dy){n.style.transition='none';n.style.transform=`translate(${dx}px,${dy}px)`;requestAnimationFrame(()=>{n.style.transition='transform .16s ease-out';n.style.transform=''})}});
}
function bigStop(by){const who=by?(by===myId?'Você deu ESTOPE!':`de ${nameOf(by)}`):'Acabou o tempo!';
  const b=el('div',{class:'bigstop',role:'status','aria-live':'assertive'},el('div',{class:'card'},el('span',{class:'hand','aria-hidden':'true',text:by?'✋':'⏰'}),el('span',{class:'word',text:'ESTOPE!'}),el('span',{class:'who',text:who})));
  document.querySelectorAll('.bigstop').forEach(x=>x.remove());document.body.append(b);setTimeout(()=>b.remove(),1950)}
function bigLetter(L){if(REDUCED)return;const b=el('div',{class:'bigletter','aria-hidden':'true'},el('span',{text:L}));document.body.append(b);setTimeout(()=>b.remove(),1700)}
function confetti(){if(REDUCED)return;const box=el('div',{class:'confetti','aria-hidden':'true'});const C=['#E0403A','#F08A24','#F2C230','#1C9A5E','#2347D6','#D94C9C'];
  for(let i=0;i<70;i++){const p=el('i');const sh=i%3;p.style.cssText=`left:${Math.random()*100}%;background:${sh===2?'none':C[i%6]};color:${C[i%6]};animation-delay:${Math.random()*1.2}s;animation-duration:${2.4+Math.random()*1.8}s;--dx:${(Math.random()*2-1)*90}px;--r:${Math.random()*720-360}deg;${sh===1?'border-radius:50%;width:9px;height:9px;':''}`;if(sh===2)p.textContent='★';box.append(p)}
  document.body.append(box);setTimeout(()=>box.remove(),5200)}
function reelLoop(t){
  const r=reel,g=$('#lgrid');
  if(r&&g&&!r.done){
    const k=Math.min(1,(t-r.start)/r.dur);
    const pool=[...g.querySelectorAll('.lt:not(.usedl)')];
    if(!REDUCED&&k<.5){if(!r.ls||t-r.ls>170){r.ls=t;shuffleGrid(g);beep(900+Math.random()*300,.02,'square',.02)}}
    else if(!REDUCED&&k<1&&pool.length){
      const gap=70+((k-.5)/.5)*380;
      if(!r.lh||t-r.lh>gap){r.lh=t;g.querySelectorAll('.hop').forEach(n=>n.classList.remove('hop'));
        let n=pool[Math.floor(Math.random()*pool.length)];if(n===r.prev&&pool.length>1)n=pool[(pool.indexOf(n)+1)%pool.length];
        r.prev=n;n.classList.add('hop');beep(1200,.02,'square',.025);const cap=$('#reelCap');if(cap)cap.textContent='Escolhendo…'}}
    if(k>=1){r.done=true;g.querySelectorAll('.hop').forEach(n=>n.classList.remove('hop'));
      const n=g.querySelector(`[data-l="${r.letter}"]`);if(n)n.classList.add('pick');
      const cap=$('#reelCap');if(cap)cap.textContent=`Letra ${r.letter}!`;bigLetter(r.letter);beep(660,.12,'triangle',.08);setTimeout(()=>beep(990,.2,'triangle',.08),120)}
  }
  requestAnimationFrame(reelLoop);
}
requestAnimationFrame(reelLoop);
setInterval(()=>{
  if(!state)return;
  if(state.phase==='play'&&state.playDur){const r=timeLeft();const t=$('#timer');if(t){t.textContent=mmss(r);t.classList.toggle('low',r<=10)}const ri=$('#roundInfo');ri.textContent=barTimeText();ri.classList.toggle('low',r<=10)}else $('#roundInfo').classList.remove('low');
  if(state.phase==='stopping')updateSheet();

$('#copyBtn').onclick=async()=>{const url=roomUrl();
  if(navigator.share&&matchMedia('(pointer:coarse)').matches){try{await navigator.share({title:'ESTOPE!',text:'Bora jogar Stop!',url});return}catch{}}
  try{await navigator.clipboard.writeText(url);toast('Link copiado')}catch{toast(url)}};
const menu=$('#menu'),menuBtn=$('#menuBtn');
const closeMenu=()=>{menu.hidden=true;menuBtn.setAttribute('aria-expanded','false');menu.querySelectorAll('.armed').forEach(disarm)};
menuBtn.onclick=e=>{e.stopPropagation();const open=menu.hidden;closeMenu();if(open){menu.hidden=false;menuBtn.setAttribute('aria-expanded','true')}};

function disarm(b){b.classList.remove('armed');b.replaceChildren(el('span',{class:'mi',text:b.dataset.icon}),' ',el('span',{class:'ml',text:b.dataset.label}))}
function armed(id,fn){const b=$(id);b.onclick=e=>{e.stopPropagation();if(!b.classList.contains('armed')){menu.querySelectorAll('.armed').forEach(disarm);b.classList.add('armed');b.textContent=matchMedia('(pointer:fine)').matches?'Clique de novo para confirmar':'Toque de novo para confirmar';return}closeMenu();fn()}}
